name: Order parsing harness checks
on:
  push:
    paths:
      - 'script/**'
      - 'app/src/main/java/com/driveorderpad/bagels/BagelModels.kt'
      - '.github/workflows/order-parsing-eval.yml'
  pull_request:
    paths:
      - 'script/**'
      - 'app/src/main/java/com/driveorderpad/bagels/BagelModels.kt'
      - '.github/workflows/order-parsing-eval.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify scoring, replay and fixture validation
        run: python -m unittest discover -s script -p 'test_*.py' -v
      - name: Validate model and prompt request matrix without API calls
        run: python script/order_eval.py --dry-run --output script/results/ci-dry-run
